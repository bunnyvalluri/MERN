<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary Meta Tags (static shell fallback — SEOHead overrides per route) ── -->
    <title>InternHub — Find the Right Internship. Build Your Future.</title>
    <meta name="title" content="InternHub — Find the Right Internship. Build Your Future." />
    <meta
      name="description"
      content="Discover 2,000+ verified tech internships at top startups and Fortune 500 companies. Apply directly with your student profile and track every application in real time."
    />
    <meta name="keywords" content="internships, software engineer intern, tech internships, college jobs, career discovery, application tracking, student hiring, remote internships" />
    <meta name="author" content="VALLURI RAHUL (https://valluri-rahul-portfolio.vercel.app/)" />
    <meta name="creator" content="VALLURI RAHUL" />
    <meta name="copyright" content="VALLURI RAHUL" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large" />

    <!-- ── Canonical (overridden by SEOHead per route) ──────────────────── -->
    <link rel="canonical" href="https://internhub.dev/" />

    <!-- ── Open Graph / Facebook ────────────────────────────────────────── -->
    <meta property="og:site_name" content="InternHub" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://internhub.dev/" />
    <meta property="og:title" content="InternHub — Find the Right Internship. Build Your Future." />
    <meta
      property="og:description"
      content="Discover curated tech internships, apply directly, and track your career journey in one unified platform."
    />
    <meta property="og:image" content="https://internhub.dev/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="InternHub — Find the Right Internship. Build Your Future." />
    <meta property="og:locale" content="en_US" />

    <!-- ── Twitter Card ──────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@internhubdev" />
    <meta name="twitter:url" content="https://internhub.dev/" />
    <meta name="twitter:title" content="InternHub — Find the Right Internship. Build Your Future." />
    <meta
      name="twitter:description"
      content="Discover curated tech internships, apply directly, and track your career journey in one unified platform."
    />
    <meta name="twitter:image" content="https://internhub.dev/og-default.jpg" />
    <meta name="twitter:image:alt" content="InternHub — Find the Right Internship. Build Your Future." />

    <!-- ── Apple / PWA ───────────────────────────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="InternHub" />

    <!-- ── Performance: Preconnect & Font Preload ────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Preload Inter 700 (bold) which is the LCP text weight used in the
      hero headline. This eliminates the FOUT and improves CLS/LCP scores.
    -->
    <link
      rel="preload"
      href="https://fonts.gstatic.com/s/inter/v13/UcC73FwrK3iLTeHuS_fvQtMwCp50KnMa1ZL7.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- ── Google Search Console verification (replace token) ────────────── -->
    <!-- <meta name="google-site-verification" content="REPLACE_WITH_YOUR_TOKEN" /> -->
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-brand-500/20 selection:text-brand-700">
    <!-- Skip to main content for keyboard/screen-reader users -->
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-brand-600 focus:text-white focus:rounded-lg focus:font-semibold focus:shadow-lg"
    >
      Skip to main content
    </a>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
