services:
  # ─── MongoDB Database ───────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0-jammy
    container_name: internhub-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: internhub
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internhub-network

  # ─── Backend API Service ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: internhub-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/internhub
      CLIENT_URL: http://localhost:5173
      JWT_ACCESS_SECRET: dev_jwt_access_secret_key_minimum_64_characters_long_for_security_internhub_dev_key
      JWT_REFRESH_SECRET: dev_jwt_refresh_secret_key_minimum_64_characters_long_for_security_internhub_dev_key
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - internhub-network

  # ─── Frontend Client Service ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: internhub-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - internhub-network

volumes:
  mongodb_data:
    driver: local

networks:
  internhub-network:
    driver: bridge
