name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
    branches:
      - main
      - master

# Cancel concurrent in-progress runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. Security & Secret Audit ──────────────────────────────────────────────
  security-audit:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Audit Root Dependencies
        run: npm audit --audit-level=high || true

      - name: Audit Backend Dependencies
        run: |
          cd backend
          npm audit --audit-level=high || true

      - name: Audit Frontend Dependencies
        run: |
          cd frontend
          npm audit --audit-level=high || true

      - name: Check for Uncommitted Secrets & Sensitive Patterns
        run: |
          echo "Scanning for accidental hardcoded secrets..."
          # Reject tracked .env files
          if git ls-files | grep -E '^\.env$|backend/\.env$|frontend/\.env$' | grep -v '\.example$'; then
            echo "ERROR: Real .env files must never be committed to git!"
            exit 1
          fi
          echo "Secret check passed."

  # ─── 2. Backend Validation & Test Suite ──────────────────────────────────────
  backend-ci:
    name: Backend Lint, Test & Validate
    runs-on: ubuntu-latest
    needs: [security-audit]
    env:
      NODE_ENV: test
      PORT: 5001
      CLIENT_URL: http://localhost:5173
      JWT_ACCESS_SECRET: ci_test_jwt_access_secret_key_minimum_64_characters_long_for_security
      JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_key_minimum_64_characters_long_for_security
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      EMAIL_VERIFY_EXPIRES_IN: 24
      PASSWORD_RESET_EXPIRES_IN: 15
      EMAIL_FROM: noreply@internhub.dev
      EMAIL_FROM_NAME: InternHub
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Validate Environment Schema
        run: |
          test -f backend/.env.example || { echo "Missing backend/.env.example"; exit 1; }
          echo "Backend environment template validated."

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Backend ESLint
        run: |
          cd backend
          npm run lint

      - name: Validate Backend Modules & Syntax
        run: |
          cd backend
          node --input-type=module --eval "import './src/app.js'; console.log('Backend application boots cleanly.');"

      - name: Run Backend Production Verification
        run: |
          node backend/scripts/verify_production_readiness.js

      - name: Run Backend Unit Tests
        run: |
          cd backend
          npm run test:unit

  # ─── 3. Frontend Validation, Test & Build ────────────────────────────────────
  frontend-ci:
    name: Frontend Lint, Test & Production Build
    runs-on: ubuntu-latest
    needs: [security-audit]
    env:
      VITE_API_BASE_URL: http://localhost:5000/api/v1
      VITE_APP_NAME: InternHub
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Frontend Environment Schema
        run: |
          test -f frontend/.env.example || { echo "Missing frontend/.env.example"; exit 1; }
          echo "Frontend environment template validated."

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Frontend Unit & Component Tests
        run: |
          cd frontend
          npm run test

      - name: Compile Production Bundle (Vite Build)
        run: |
          cd frontend
          npm run build

      - name: Verify Build Artifacts
        run: |
          test -f frontend/dist/index.html || { echo "Missing frontend/dist/index.html"; exit 1; }
          test -f frontend/dist/robots.txt || { echo "Missing frontend/dist/robots.txt"; exit 1; }
          test -f frontend/dist/sitemap.xml || { echo "Missing frontend/dist/sitemap.xml"; exit 1; }
          echo "Production assets successfully compiled and validated."

  # ─── 4. CI Gatekeeper ────────────────────────────────────────────────────────
  ci-status:
    name: CI Pipeline Status
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: always()
    steps:
      - name: Evaluate Pipeline Result
        run: |
          if [ "${{ needs.backend-ci.result }}" != "success" ] || [ "${{ needs.frontend-ci.result }}" != "success" ]; then
            echo "CI pipeline failed. Deployment blocked."
            exit 1
          fi
          echo "All CI pipeline stages passed successfully. Safe to deploy."
